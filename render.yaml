services:
  # ----------------------------------------------------
  # PhishLense Python FastAPI Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: phishlense-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  # ----------------------------------------------------
  # PhishLense Vite React Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: phishlense-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend-app
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: phishlense-api
          property: host
